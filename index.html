<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Green Neko" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Green Neko — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ── Table Number Modal ─────────────────────────────── -->
    <div id="table-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-paw">🐾</div>
        <h1 class="modal-title">Green Neko</h1>
        <p class="modal-sub">Good food, good vibes</p>
        <div class="modal-input-wrap">
          <label>Your table number</label>
          <input id="table-input" type="number" placeholder="e.g. 12" min="1" max="99" />
        </div>
        <button id="start-btn" class="start-btn">
          Let's Eat <span class="btn-arrow">→</span>
        </button>
        <button id="skip-table-btn" class="skip-table-btn">Skip for now</button>
      </div>
    </div>

    <!-- ── Main App ───────────────────────────────────────── -->
    <div id="main" class="hidden">

      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <img class="brand-icon" src="icon-192.png" alt="Green Neko" />
          <span class="brand-name">Green Neko</span>
        </div>
        <button id="cart-btn" class="cart-btn" aria-label="View cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span id="cart-badge" class="cart-badge hidden">0</span>
        </button>
      </header>

      <!-- Category Tabs -->
      <div class="categories-wrap">
        <div id="categories" class="categories" role="tablist"></div>
      </div>

      <!-- Card Stack Area -->
      <div class="card-area">
        <div id="card-stack" class="card-stack" aria-live="polite"></div>

        <!-- Empty / End State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-emoji">🐱</div>
          <h2>You've seen it all!</h2>
          <p>Ready to order something delicious?</p>
          <div class="empty-actions">
            <button id="view-cart-empty-btn" class="btn-primary">View Cart</button>
            <button id="restart-btn" class="btn-ghost">Browse Again</button>
          </div>
        </div>
      </div>


      <!-- Swipe Hint Buttons -->
      <div id="swipe-buttons" class="swipe-buttons">
        <button id="skip-btn" class="swipe-action-btn skip" aria-label="Skip item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button id="undo-btn" class="swipe-action-btn undo" aria-label="Undo last swipe">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
        </button>
        <button id="like-btn" class="swipe-action-btn like" aria-label="Add item to cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </button>
      </div>

    </div><!-- /#main -->

    <!-- ── Cart Overlay ───────────────────────────────────── -->
    <div id="cart-overlay" class="cart-overlay hidden" role="dialog" aria-label="Your cart">
      <div id="cart-sheet" class="cart-sheet">
        <div class="cart-drag-handle"></div>
        <div class="cart-header">
          <h2 class="cart-title">Your Order</h2>
          <span id="cart-table-label" class="cart-table-label"></span>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
          <div class="cart-total-row">
            <span>Total</span>
            <span id="cart-total" class="cart-total-amount">$0.00</span>
          </div>
          <button id="whatsapp-btn" class="whatsapp-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Send Order via WhatsApp
          </button>
          <button id="close-cart-btn" class="close-cart-btn">Continue Browsing</button>
        </div>
      </div>
    </div>

    <!-- ── Toast ─────────────────────────────────────────── -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- ── Install Banner ────────────────────────────────── -->
    <div id="install-banner" class="install-banner hidden">
      <div class="install-banner-inner">
        <span class="install-icon">📲</span>
        <div class="install-text">
          <strong>Add to Home Screen</strong>
          <span id="install-hint"></span>
        </div>
        <button id="install-action" class="install-action-btn"></button>
        <button id="install-dismiss" class="install-dismiss">✕</button>
      </div>
    </div>

  </div><!-- /#app -->

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
